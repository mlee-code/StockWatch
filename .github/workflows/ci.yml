name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Formatação
        run: ruff format --check .
      - name: Tipos
        run: mypy
      - name: Testes
        run: pytest --cov=stockwatch --cov-report=term-missing

  volume:
    # Lento (1 milhão de movimentações): só sob demanda, pela aba Actions.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e '.[dev]'
      - name: Volume e benchmarks
        run: pytest -m volume tests/volume tests/desempenho --benchmark-json=desempenho.json
      - uses: actions/upload-artifact@v4
        with:
          name: desempenho
          path: desempenho.json
