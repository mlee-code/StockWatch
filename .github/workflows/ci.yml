name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Formatação
        run: ruff format --check .
      - name: Tipos
        run: mypy
      - name: Testes
        run: pytest --cov=stockwatch --cov-report=term-missing
