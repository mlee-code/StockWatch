[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stockwatch"
version = "0.1.0.dev0"
description = "Controle de estoque e validade com interface de terminal para pequenos comércios."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "M Lee" }]
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
stockwatch = "stockwatch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stockwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not volume' -W error::DeprecationWarning"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "volume: testes de volume, lentos; rodar com -m volume",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4"]
# N818 exige sufixo "Error"; exceções seguem nomes em português (DECISION-001).
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_untyped_imports = true
